<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account · SteamDB</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="header">
        <a href="/" class="logo">SteamDB</a>
    </header>

    <main class="page auth-page">
        <form id="registerForm" class="panel auth-form" novalidate>
            <h1>Create account</h1>

            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" maxlength="50" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" maxlength="255" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required
                   aria-describedby="passwordHint">
            <p id="passwordHint" class="muted small">At least 8 characters.</p>

            <label for="confirm">Confirm password</label>
            <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

            <p id="formError" class="error-text" role="alert"></p>

            <button type="submit" class="button primary">Create account</button>

            <p class="muted small">Already have an account? <a id="loginLink" href="/login.html">Log in</a></p>
        </form>
    </main>

    <script src="/js/register.js"></script>

</body>

</html>
