<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendation quiz · SteamDB</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">SteamDB</a>
        <form id="searchForm" class="search-container">
            <input id="searchInput" type="search" placeholder="Search games..." autocomplete="off">
            <button type="submit">Search</button>
        </form>
        <nav id="accountNav"></nav>
    </header>

    <main class="page">
        <h1>Find your next game</h1>
        <p class="muted">Six quick questions. Your answers become genre preferences, and we recommend well-reviewed games that match them.</p>
        <section id="quizContent" aria-live="polite"><p class="muted">Loading...</p></section>
        <section id="quizResults" aria-live="polite"></section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/quiz.js"></script>
</body>
</html>
